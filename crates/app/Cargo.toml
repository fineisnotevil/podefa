[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Desktop PDF viewer application for PODEFA"

[lints]
workspace = true

[features]
# Export as Word (Plan 0005 Phase 5): off until a writer keeps the layout; see engine-mupdf's feature.
docx = ["engine-mupdf/docx"]

[build-dependencies]
slint-build = { workspace = true }

[dependencies]
pdf-core = { workspace = true }
engine-mupdf = { workspace = true }
slint = { workspace = true }

# The desktop's file dialogs and message boxes (`platform::desktop`).
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { workspace = true }

# The clipboard (Plan 0003, §3.3; ADR 0006): the same arboard Slint's winit backend already links,
# with the same features, so no second copy is built.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
arboard = { version = "3.6", default-features = false }

# Android (Plan 0008 Phase 1, ADR 0012): Slint's backend for the activity, and JNI for the
# activity's pickers, message boxes and clipboard (`platform::android`).
[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }
jni = { version = "0.21", default-features = false }
