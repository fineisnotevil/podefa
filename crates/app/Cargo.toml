[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Desktop PDF viewer application for PODEFA"

[lints]
workspace = true

[features]
# Export as Word (Plan 0005 Phase 5): off until a writer keeps the layout; see engine-mupdf's feature.
docx = ["engine-mupdf/docx"]

[build-dependencies]
slint-build = { workspace = true }

[dependencies]
pdf-core = { workspace = true }
engine-mupdf = { workspace = true }
slint = { workspace = true }
rfd = { workspace = true }

# The clipboard (Plan 0003, §3.3; ADR 0006): the same arboard Slint's winit backend already links,
# with the same features, so no second copy is built.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3.6", default-features = false }
