name: Feature Request
description: Suggest an idea or enhancement for [PROJECT_NAME]
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please ensure the proposed feature aligns with the project goals outlined in [README.md](README.md#goals-and-non-goals).
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or limitation?
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature, architectural concept, or user interaction you would like added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
    validations:
      false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any screenshots, mockups, or relevant specifications.
