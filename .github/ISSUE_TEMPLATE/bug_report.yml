name: Bug Report
description: Create a report to help us improve [PROJECT_NAME]
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        If you suspect this is a security vulnerability, please consult our [Security Policy](https://github.com/TODO/[PROJECT_NAME]/security/policy) rather than opening a public issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior, including commands or sample input.
      placeholder: |
        1. Run `cargo run -p app`
        2. Open file `example.pdf`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Rust toolchain version, LLVM version.
      placeholder: |
        - OS: Windows 11 / Ubuntu 24.04 / macOS Sequoia
        - Rust version: rustc 1.85.0
        - LLVM / Clang version: 18.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional Logs or Context
      description: Terminal output, panic backtraces, or screenshots.
      render: shell
