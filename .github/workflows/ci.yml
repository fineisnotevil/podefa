name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config libxkbcommon-dev libfontconfig1-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Configure system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin") {
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
            echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          }

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: |
          if command -v cargo-nextest >/dev/null 2>&1; then
            cargo nextest run --workspace
          else
            cargo test --workspace
          fi
        shell: bash

      - name: Cargo deny check
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  reuse-lint:
    name: REUSE Compliance Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v2

  dco-check:
    name: DCO Sign-off Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify Signed-off-by on all commits
        run: |
          echo "Verifying DCO sign-offs on PR commits..."
          COMMITS=$(git log --no-merges --format="%H" origin/${{ github.base_ref }}..HEAD)
          for commit in $COMMITS; do
            if ! git log -1 --format="%B" "$commit" | grep -q "^Signed-off-by:"; then
              echo "::error::Commit $commit is missing a 'Signed-off-by:' trailer (git commit -s)."
              exit 1
            fi
          done
          echo "All PR commits have valid DCO sign-offs."
